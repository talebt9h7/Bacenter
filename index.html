            <SBox label="منخفضة المخزون" val={stAlr.length+" منتج"} color={stAlr.length?"var(--orange)":"var(--green)"} sub="بحسب حد التنبيه"/>
            <SBox label="حركات المخزون" val={inventoryMoves.length+" حركة"} color="var(--indigo)" sub="آخر الحركات المسجلة"/>
          </div>
          <div className="g2">
            <Card title="تسجيل حركة مخزون" bar="var(--blue)">
              <div className="fg" style={{gridTemplateColumns:"2fr 1fr 1fr 2fr auto"}}>
                <div className="field"><label className="field-lbl">المنتج</label><select value={stockAdj.productId} onChange={e=>setStockAdj({...stockAdj,productId:e.target.value})}><option value="">— اختر المنتج —</option>{products.map(p=><option key={p.id} value={p.id}>{p.name} · {p.stock||0}</option>)}</select></div>
                <div className="field"><label className="field-lbl">النوع</label><select value={stockAdj.type} onChange={e=>setStockAdj({...stockAdj,type:e.target.value})}><option value="add">إضافة</option><option value="remove">سحب</option></select></div>
                <div className="field"><label className="field-lbl">الكمية</label><input type="number" value={stockAdj.qty} onChange={e=>setStockAdj({...stockAdj,qty:e.target.value})}/></div>
                <div className="field"><label className="field-lbl">ملاحظة</label><input value={stockAdj.note} onChange={e=>setStockAdj({...stockAdj,note:e.target.value})} placeholder="سبب الحركة"/></div>
                <button className="btn btn-blue" style={{height:44,marginTop:23,borderRadius:12}} onClick={recInventoryMove}>تسجيل</button>
              </div>
            </Card>
            <Card title="تنبيهات المخزون" bar="var(--orange)">
              {stAlr.length===0?<div className="empty"><div className="empty-ico">📦</div><div className="empty-txt">المخزون مطمئن حاليًا</div></div>:stAlr.map(p=>(
                <div key={p.id} className="dr">
                  <div><div className="dr-l b">{p.name}</div><div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>حد التنبيه {p.stockAlert||3}</div></div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><span className="dr-v" style={{color:(p.stock||0)===0?"var(--red)":"var(--orange)"}}>{p.stock||0}</span><button className="btn-soft" onClick={()=>{setTab("products");startEditProduct(p)}}>تعديل</button></div>
                </div>
              ))}
            </Card>
          </div>
          <Card title="سجل حركة المخزون" bar="var(--indigo)">
            {inventoryMoves.length===0?<div className="empty"><div className="empty-ico">🧮</div><div className="empty-txt">لا توجد حركات مخزون بعد</div></div>:<div className="tbl-wrap"><table>
              <thead><tr>{["التاريخ","الوقت","المنتج","النوع","الكمية","بعد الحركة","المستخدم","الملاحظة"].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{inventoryMoves.map(m=>(
                <tr key={m.id}>
                  <td style={{color:"var(--t3)"}}>{arD(m.date)}</td>
                  <td style={{color:"var(--t3)"}}>{arT(m.date)}</td>
                  <td style={{fontWeight:700}}>{m.productName}</td>
                  <td><Tag text={m.type==="add"?"إضافة":"سحب"} color={m.type==="add"?"var(--green)":"var(--red)"}/></td>
                  <td>{m.qty}</td>
                  <td style={{fontWeight:700}}>{m.stockAfter}</td>
                  <td>{m.user||"—"}</td>
                  <td style={{color:"var(--t3)"}}>{m.note||"—"}</td>
                </tr>
              ))}</tbody>
            </table></div>}
          </Card>
        </div>
      )}

      {/* ══ CUSTOMERS ══ */}
      {tab==="customers"&&(()=>{
        /* نجمع العملاء من الطلبيات والمبيعات الآجلة والمبيعات المباشرة */
        const custMap={};
        /* من الطلبيات */
        orders.forEach(o=>{
          if(!o.customer)return;
          const k=o.customer.trim().toLowerCase();
          if(!custMap[k])custMap[k]={name:o.customer.trim(),phone:o.phone||"",governorate:o.governorate||"",address:o.address||"",totalSpent:0,purchases:0,lastDate:o.date,products:[],source:"طلبية",notes:""};
          if(o.status==="delivered"){
            const tot=o.total||0;
            custMap[k].totalSpent+=tot;
            custMap[k].purchases+=1;
          }
          if(!custMap[k].phone&&o.phone)custMap[k].phone=o.phone;
          if(!custMap[k].governorate&&o.governorate)custMap[k].governorate=o.governorate;
          if(!custMap[k].address&&o.address)custMap[k].address=o.address;
          if(o.date>custMap[k].lastDate)custMap[k].lastDate=o.date;
          const oi=o.items||[{productName:o.productName}];
          oi.forEach(item=>{if(item.productName&&!custMap[k].products.includes(item.productName))custMap[k].products.push(item.productName)});
        });
        /* من المبيعات الآجلة (credits) */
        credits.forEach(c=>{
          if(!c.customer)return;
          const k=c.customer.trim().toLowerCase();
          if(!custMap[k])custMap[k]={name:c.customer.trim(),phone:"",totalSpent:0,purchases:0,lastDate:c.date,products:[],source:"آجل",notes:""};
          custMap[k].totalSpent+=c.totalAmount||0;
          custMap[k].purchases+=1;
          if(c.date>custMap[k].lastDate)custMap[k].lastDate=c.date;
          if(c.productName&&!custMap[k].products.includes(c.productName))custMap[k].products.push(c.productName);
        });
        /* من المبيعات المباشرة التي لها اسم زبون */
        sales.forEach(s=>{
          const nm=s.customer;
          if(!nm||nm.length<2)return;
          const k=nm.trim().toLowerCase();
          if(!custMap[k])custMap[k]={name:nm.trim(),phone:"",totalSpent:0,purchases:0,lastDate:s.date,products:[],source:"بيعة",notes:""};
          custMap[k].totalSpent+=s.total||0;
          custMap[k].purchases+=1;
          if(s.date>custMap[k].lastDate)custMap[k].lastDate=s.date;
          if(s.productName&&!custMap[k].products.includes(s.productName))custMap[k].products.push(s.productName);
        });
        const custList=Object.values(custMap).sort((a,b)=>b.totalSpent-a.totalSpent);
        const totalCustomers=custList.length;
        const totalRev=custList.reduce((a,c)=>a+c.totalSpent,0);
        const avgSpend=totalCustomers>0?totalRev/totalCustomers:0;
        const repeatBuyers=custList.filter(c=>c.purchases>1).length;
        const filtered2=custSrch?custList.filter(c=>c.name.toLowerCase().includes(custSrch.toLowerCase())||c.phone.includes(custSrch)):custList;
        return(
          <div key="customers">
            <div className="g4" style={{marginBottom:13}}>
              <SBox label="إجمالي العملاء" val={totalCustomers+" عميل"} color="var(--blue)" sub="من الطلبيات والمبيعات"/>
              <SBox label="إجمالي الإيراد" val={fmt(totalRev)+" IQD"} color="var(--green)" sub="من جميع العملاء"/>
              <SBox label="متوسط الإنفاق" val={fmt(avgSpend)+" IQD"} color="var(--purple)" sub="للعميل الواحد"/>
              <SBox label="عملاء متكررون" val={repeatBuyers+" عميل"} color="var(--orange)" sub="اشتروا أكثر من مرة"/>
            </div>
            <Card title={"قائمة العملاء ("+filtered2.length+")"} bar="var(--blue)" extra={
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div className="srch">
                  <span className="srch-ico">🔍</span>
                  <input style={{paddingRight:34,minWidth:200,fontSize:13,borderRadius:20}} placeholder="بحث بالاسم أو الهاتف..." value={custSrch} onChange={e=>setCustSrch(e.target.value)}/>
                  {custSrch&&<button className="srch-x" onClick={()=>setCustSrch("")}>✕</button>}
                </div>
                {filtered2.length>0&&<button className="btn bso bso-g" onClick={()=>exportCustomersXLS(filtered2)}>⬇ Excel</button>}
              </div>
            }>
              {filtered2.length===0
                ?<div className="empty"><div className="empty-ico">👥</div><div className="empty-txt">{custSrch?"لا نتائج":"لا يوجد عملاء بعد — سيظهرون هنا تلقائياً من الطلبيات والمبيعات"}</div></div>
                :<div className="tbl-wrap"><table>
                  <thead><tr>
                    <th>#</th>
                    <th>اسم العميل</th>
                    <th>الهاتف</th>
                    <th>المشتريات</th>
                    <th>إجمالي الإنفاق</th>
                    <th>متوسط الفاتورة</th>
                    <th>المنتجات المشتراة</th>
                    <th>المصدر</th>
                    <th>آخر تعامل</th>
                  </tr></thead>
                  <tbody>{filtered2.map((c,i)=>{
                    const avg=c.purchases>0?c.totalSpent/c.purchases:0;
                    const tier=c.totalSpent>=500000?"var(--purple)":c.totalSpent>=200000?"var(--blue)":c.totalSpent>=50000?"var(--green)":"var(--t3)";
                    const tierLbl=c.totalSpent>=500000?"VIP":c.totalSpent>=200000?"ذهبي":c.totalSpent>=50000?"فضي":"عادي";
                    return(
                      <tr key={i}>
                        <td style={{color:"var(--t4)",fontSize:12}}>{i+1}</td>
                        <td>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{width:30,height:30,borderRadius:"50%",background:`linear-gradient(135deg,${tier},${tier}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",flexShrink:0}}>{c.name[0]}</div>
                            <div>
                              <div style={{fontWeight:600,fontSize:13}}>{c.name}</div>
                              <Tag text={tierLbl} color={tier}/>
                            </div>
                          </div>
                        </td>
                        <td style={{color:"var(--blue)",fontSize:13}}>{c.phone||<span style={{color:"var(--t4)"}}>—</span>}</td>
                        <td style={{textAlign:"center"}}>
                          <span style={{fontFamily:"var(--sf-d)",fontSize:16,fontWeight:700,color:"var(--t1)"}}>{c.purchases}</span>
                          {c.purchases>1&&<div style={{fontSize:10,color:"var(--green)",fontWeight:600}}>متكرر ↻</div>}
                        </td>
                        <td style={{color:"var(--blue)",fontWeight:700,fontSize:14,fontVariantNumeric:"tabular-nums"}}>{fmt(c.totalSpent)} IQD</td>
                        <td style={{color:"var(--t2)",fontVariantNumeric:"tabular-nums"}}>{fmt(avg)} IQD</td>
                        <td style={{maxWidth:180}}>
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {c.products.slice(0,3).map((p,j)=>(
                              <span key={j} style={{fontSize:10,background:"var(--bg)",border:".5px solid var(--line2)",borderRadius:5,padding:"2px 6px",color:"var(--t2)",whiteSpace:"nowrap"}}>{p}</span>
                            ))}
                            {c.products.length>3&&<span style={{fontSize:10,color:"var(--t3)"}}>+{c.products.length-3}</span>}
                          </div>
                        </td>
                        <td><Tag text={c.source} color={c.source==="طلبية"?"var(--blue)":c.source==="آجل"?"var(--orange)":"var(--green)"}/></td>
                        <td style={{color:"var(--t3)",fontSize:12,whiteSpace:"nowrap"}}>{arD(c.lastDate)}</td>
                      </tr>
                    );
                  })}</tbody>
                  <tfoot><tr>
                    <td colSpan="3" style={{color:"var(--t3)",fontSize:12}}>{filtered2.length} عميل</td>
                    <td style={{textAlign:"center",fontWeight:700}}>{filtered2.reduce((a,c)=>a+c.purchases,0)}</td>
                    <td style={{color:"var(--blue)",fontWeight:700}}>{fmt(filtered2.reduce((a,c)=>a+c.totalSpent,0))} IQD</td>
                    <td colSpan="4"/>
                  </tr></tfoot>
                </table></div>
              }
            </Card>
          </div>
        );
      })()}

      {/* ══ CAMPAIGNS ══ */}
      {tab==="campaigns"&&(
        <div key="campaigns">
          <Card title="إضافة حملة" bar="var(--purple)">
            <div className="fg" style={{gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr auto"}}>
              {[{k:"name",l:"اسم الحملة",ph:"حملة..."},{k:"budget",l:"الإنفاق",ph:"0"},{k:"messages",l:"الرسائل المرسلة",ph:"0"},{k:"buyers",l:"اشتروا من الرسائل",ph:"0"},{k:"clicks",l:"الكليكات",ph:"0"},{k:"orders",l:"الطلبات",ph:"0"},{k:"revenue",l:"الإيراد",ph:"0"}].map(f=>(
                <div key={f.k} className="field"><label className="field-lbl">{f.l}</label><input placeholder={f.ph} value={nC[f.k]} onChange={e=>setNC({...nC,[f.k]:e.target.value})}/></div>
              ))}
              <div className="field"><label className="field-lbl">الشهر</label><input type="month" value={nC.month} onChange={e=>setNC({...nC,month:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">المنصة</label>
                <select value={nC.platform} onChange={e=>setNC({...nC,platform:e.target.value})}>
                  {[["instagram","إنستكرام"],["facebook","فيسبوك"],["tiktok","تيكتوك"],["google","جوجل"],["snapchat","سناب"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
                </select>
              </div>
              <button className="btn btn-blue" style={{height:44,marginTop:23,borderRadius:12}} onClick={addCamp}>إضافة</button>
            </div>
          </Card>
          {campaigns.map(c=>{
            const ro=c.budget>0?c.revenue/c.budget:0;const cp2=c.orders>0?c.budget/c.orders:0;const cv=c.clicks>0?(c.orders/c.clicks)*100:0;
            const msgConv=c.messages>0?(c.buyers/c.messages)*100:0;
            const rc=ro>=3?"var(--green)":ro>=1.5?"var(--orange)":"var(--red)";
            const mc=msgConv>=10?"var(--green)":msgConv>=5?"var(--orange)":"var(--red)";
            return(
              <div key={c.id} className="camp-card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:15}}>
                  <div style={{display:"flex",gap:9,alignItems:"center",flexWrap:"wrap"}}>
                    <input value={c.name} onChange={e=>updC(c.id,"name",e.target.value)} style={{background:"transparent",border:"1.5px solid var(--line2)",width:210,borderRadius:9,padding:"6px 11px",color:"var(--t1)",fontSize:14,fontWeight:600}}/>
                    <select value={c.platform||"instagram"} onChange={e=>updC(c.id,"platform",e.target.value)} style={{width:108,padding:"6px 9px",fontSize:13}}>
                      {[["instagram","إنستكرام"],["facebook","فيسبوك"],["tiktok","تيكتوك"],["google","جوجل"],["snapchat","سناب"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
                    </select>
                    <input type="month" value={c.month||mStr()} onChange={e=>updC(c.id,"month",e.target.value)} style={{width:145,padding:"6px 9px",fontSize:13}}/>
                    <select value={c.status} onChange={e=>updC(c.id,"status",e.target.value)} style={{width:88,padding:"6px 9px",fontSize:13}}>
                      <option value="active">نشطة</option><option value="paused">موقوفة</option><option value="ended">منتهية</option>
                    </select>
                  </div>
                  <button className="btn-icon" onClick={()=>delC(c.id)}>✕</button>
                </div>
                {/* الحقول الرئيسية */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:11,marginBottom:11}}>
                  {["budget","clicks","orders","revenue"].map((f,i)=>(
                    <div key={f} className="field"><label className="field-lbl">{["الإنفاق (IQD)","الكليكات","الطلبات","الإيراد (IQD)"][i]}</label><input type="number" value={c[f]||0} onChange={e=>updC(c.id,f,+e.target.value)}/></div>
                  ))}
                </div>
                {/* قسم الرسائل */}
                <div style={{background:"var(--purple-a)",border:".5px solid rgba(175,82,222,.2)",borderRadius:11,padding:"12px 15px",marginBottom:11}}>
                  <div style={{fontSize:11,fontWeight:700,color:"var(--purple)",letterSpacing:".04em",textTransform:"uppercase",marginBottom:10}}>📨 تتبع الرسائل</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:11}}>
                    <div className="field">
                      <label className="field-lbl">الرسائل المرسلة</label>
                      <input type="number" value={c.messages||0} onChange={e=>updC(c.id,"messages",+e.target.value)} style={{borderColor:"rgba(175,82,222,.35)"}}/>
                    </div>
                    <div className="field">
                      <label className="field-lbl">اشتروا من الرسائل</label>
                      <input type="number" value={c.buyers||0} onChange={e=>updC(c.id,"buyers",+e.target.value)} style={{borderColor:"rgba(175,82,222,.35)"}}/>
                    </div>
                    <div style={{background:"var(--card)",borderRadius:9,border:".5px solid rgba(175,82,222,.25)",padding:"9px 13px",display:"flex",flexDirection:"column",justifyContent:"center"}}>
                      <div style={{fontSize:11,color:"var(--t3)",marginBottom:3,fontWeight:500}}>تحويل الرسائل</div>
                      <div style={{fontFamily:"var(--sf-d)",fontSize:22,fontWeight:700,color:c.messages>0?mc:"var(--t4)",letterSpacing:"-.04em"}}>{c.messages>0?pct(msgConv)+"%":"—"}</div>
                      {c.messages>0&&<div style={{fontSize:10,color:mc,fontWeight:600,marginTop:2}}>{msgConv>=10?"ممتاز":msgConv>=5?"مقبول":"ضعيف"}</div>}
                    </div>
                  </div>
                </div>
                {/* مؤشرات الأداء */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:11}}>
                  {[
                    {l:"ROAS",v:pct(ro)+"x",c:rc,note:ro>=3?"ممتاز":ro>=1.5?"مقبول":"ضعيف"},
                    {l:"CPO",v:fmt(cp2)+" IQD",c:"var(--blue)",note:"تكلفة الطلب"},
                    {l:"CVR",v:pct(cv)+"%",c:"var(--indigo)",note:"معدل التحويل"},
                    {l:"إجمالي مشتري الرسائل",v:(c.buyers||0)+" عميل",c:"var(--purple)",note:c.messages>0?pct(msgConv)+"%":"—"},
                  ].map(s=>(
                    <div key={s.l} style={{background:"var(--bg)",borderRadius:9,border:".5px solid var(--line2)",padding:"9px 13px"}}>
                      <div style={{fontSize:10,color:"var(--t3)",fontWeight:500,marginBottom:3}}>{s.l}</div>
                      <div style={{fontFamily:"var(--sf-d)",fontSize:16,fontWeight:700,color:s.c,letterSpacing:"-.04em"}}>{s.v}</div>
                      <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{s.note}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:9}}>
                  <div style={{flex:1,height:4,background:"rgba(0,0,0,.08)",borderRadius:4,overflow:"hidden"}}>
                    <div style={{width:Math.min(ro*25,100)+"%",height:"100%",background:rc,borderRadius:4,transition:"width 500ms var(--edec)"}}/>
                  </div>
                  <Tag text={ro>=3?"ممتاز ROAS":ro>=1.5?"مقبول":"ضعيف"} color={rc}/>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ══ COSTS ══ */}
      {tab==="costs"&&(
        <div key="costs">
          {(()=>{
            const periodOneCosts=oneTimeCosts.filter(x=>matchPeriod(x.date,period));
            const periodOneCostsTotal=periodOneCosts.reduce((a,x)=>a+Number(x.amount||0),0);
            return(<>
          <Card title="إعدادات مالية" bar="var(--blue)">
            <div style={{maxWidth:420,padding:"12px 14px",background:"var(--bg)",border:"1px solid var(--line2)",borderRadius:14,fontSize:13,color:"var(--t2)"}}>الضريبة غير مفعلة في هذا النظام، وكل الحسابات الحالية تعتمد على 0% ضريبة.</div>
          </Card>
          <Card title="التكاليف الثابتة الشهرية" bar="var(--red)" extra={<button className="btn btn-blue" style={{padding:"7px 17px",fontSize:13,borderRadius:12}} onClick={addFix}>+ إضافة</button>}>
            {fixed.map(f=>(
              <div key={f.id} style={{display:"flex",gap:11,alignItems:"center",marginBottom:9}}>
                <input style={{flex:1}} value={f.name} onChange={e=>updF(f.id,"name",e.target.value)}/>
                <input type="number" style={{width:145}} value={f.monthly} onChange={e=>updF(f.id,"monthly",e.target.value)}/>
                <span style={{fontSize:12,color:"var(--t3)",whiteSpace:"nowrap"}}>IQD / شهر</span>
                <button className="btn-icon" onClick={()=>delF(f.id)}>✕</button>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",paddingTop:13,marginTop:7,borderTop:".5px solid var(--line)"}}>
              <span style={{fontWeight:600,fontSize:14}}>الإجمالي الشهري</span>
              <span style={{fontFamily:"var(--sf-d)",fontWeight:700,fontSize:21,color:"var(--red)",letterSpacing:"-.04em",fontVariantNumeric:"tabular-nums"}}>{fmt(fixed.reduce((a,f)=>a+Number(f.monthly||0),0))} IQD</span>
            </div>
          </Card>
          <Card title={"تكاليف مرة واحدة — "+plbl} bar="var(--indigo)">

                <div className="field"><label className="field-lbl">المبلغ</label><input type="number" value={cashForm.amount} onChange={e=>setCashForm({...cashForm,amount:e.target.value})}/></div>
                <div className="field"><label className="field-lbl">المصدر</label><input value={cashForm.source} onChange={e=>setCashForm({...cashForm,source:e.target.value})} placeholder="مثال: سحب شخصي"/></div>
                <div className="field"><label className="field-lbl">ملاحظة</label><input value={cashForm.note} onChange={e=>setCashForm({...cashForm,note:e.target.value})}/></div>
                <button className="btn btn-blue" style={{height:44,marginTop:23,borderRadius:12}} onClick={addCashEntry}>حفظ</button>

      {/* ══ WEEKLY REPORT ══ */}
      {tab==="weekly"&&(
        <div key="weekly">
          {(()=>{
            const today=new Date();
            const days=Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()-i);return dayKey(d)}).reverse();
            const todayStr=dayKey(today);
            const dayData=days.map(day=>{
              const ds=sales.filter(s=>dayKey(s.date)===day);
              const dr=rets.filter(r=>dayKey(r.date)===day);
              const grossR=ds.reduce((a,s)=>a+(s.grossTotal||s.total),0);
              const disc=ds.reduce((a,s)=>a+(s.discount||0),0);
              const ret=dr.reduce((a,r)=>a+r.sellPrice*(r.qty||1),0);
              const netRev=grossR-disc-ret;
              const profit=ds.reduce((a,s)=>a+s.profit,0);
              const dayName=new Date(day+"T12:00:00").toLocaleDateString("ar-IQ",{weekday:"long"});
              const dayShort=new Date(day+"T12:00:00").toLocaleDateString("ar-IQ",{day:"numeric",month:"short"});
              return{day,dayName,dayShort,count:ds.length,grossR,disc,ret,netRev,profit,isToday:day===todayStr};
            });
            const wk={count:dayData.reduce((a,d)=>a+d.count,0),rev:dayData.reduce((a,d)=>a+d.netRev,0),disc:dayData.reduce((a,d)=>a+d.disc,0),profit:dayData.reduce((a,d)=>a+d.profit,0)};
            const prevSales=sales.filter(s=>{const diff=(today-new Date(s.date))/(86400000);return diff>=7&&diff<14});
            const prevRev=prevSales.reduce((a,s)=>a+s.total,0);
            const prevProfit=prevSales.reduce((a,s)=>a+s.profit,0);
            const maxRev=Math.max(...dayData.map(d=>d.netRev),1);
            const avgDay=wk.rev/7;
            const rChg=prevRev>0?((wk.rev-prevRev)/prevRev)*100:null;
            const pChg=prevProfit>0?((wk.profit-prevProfit)/prevProfit)*100:null;

            return(
              <div>
                <div className="g4" style={{marginBottom:13}}>
                  {[
                    {l:"إيراد الأسبوع",     v:fmt(wk.rev)+" IQD",    c:"var(--blue)",   ch:rChg},
                    {l:"صافي ربح الأسبوع",  v:fmt(wk.profit)+" IQD", c:"var(--green)",  ch:pChg},
                    {l:"عدد البيعات",        v:wk.count+" بيعة",      c:"var(--t1)",     ch:null},
                    {l:"متوسط يومي",         v:fmt(avgDay)+" IQD",    c:"var(--indigo)", ch:null},
                  ].map(k=>(
                    <div key={k.l} className="sbox">
                      <div className="sbox-l">{k.l}</div>
                      <div className="sbox-v" style={{color:k.c}}>{k.v}</div>
                      {k.ch!=null&&<div className="sbox-s" style={{color:k.ch>=0?"var(--green)":"var(--red)",fontWeight:600}}>{k.ch>=0?"↑":"↓"} {pct(Math.abs(k.ch))}% مقارنة بالأسبوع الماضي</div>}
                    </div>
                  ))}
                </div>

                <Card title="مبيعات الأسبوع — يوم بيوم" bar="var(--blue)">
                  <div style={{display:"flex",alignItems:"flex-end",gap:7,height:150,padding:"0 3px",marginBottom:11}}>
                    {dayData.map(d=>{
                      const h=maxRev>0?Math.max(4,Math.round((d.netRev/maxRev)*130)):4;
                      return(
                        <div key={d.day} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                          <div style={{fontSize:10,color:"var(--t3)",fontVariantNumeric:"tabular-nums",textAlign:"center",minHeight:26}}>
                            {d.netRev>0&&<span>{fmt(d.netRev)}<br/>IQD</span>}
                          </div>
                          <div style={{width:"100%",height:h,background:d.isToday?"var(--blue)":d.netRev===0?"rgba(0,0,0,.06)":"rgba(0,113,227,.22)",borderRadius:"5px 5px 0 0",border:d.isToday?".5px solid var(--blue)":d.netRev>0?".5px solid rgba(0,113,227,.25)":".5px solid var(--line)",position:"relative",overflow:"hidden"}}>
                            {d.profit>0&&d.netRev>0&&<div style={{position:"absolute",bottom:0,left:0,right:0,height:Math.round((d.profit/d.netRev)*h),background:d.isToday?"rgba(52,199,89,.6)":"rgba(52,199,89,.4)",borderRadius:"5px 5px 0 0"}}/>}
                          </div>
                          <div style={{fontSize:11,fontWeight:d.isToday?700:400,color:d.isToday?"var(--blue)":"var(--t3)",textAlign:"center"}}>{d.dayShort}</div>
                          <div style={{fontSize:10,color:"var(--t4)",textAlign:"center"}}>{d.dayName.slice(0,3)}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{display:"flex",gap:14,fontSize:11,color:"var(--t3)"}}>
                    {[{bg:"rgba(0,113,227,.22)",l:"إيراد"},{bg:"rgba(52,199,89,.4)",l:"ربح"},{bg:"var(--blue)",l:"اليوم"}].map(x=>(
                      <span key={x.l} style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:11,height:11,background:x.bg,borderRadius:3,display:"inline-block"}}/>{x.l}</span>
                    ))}
                  </div>
                </Card>

                <Card title="تفاصيل كل يوم" bar="var(--indigo)">
                  <div className="tbl-wrap"><table>
                    <thead><tr>{["اليوم","التاريخ","المبيعات","الإيراد","الخصومات","المرتجعات","صافي الإيراد","الربح","هامش%"].map(h=><th key={h}>{h}</th>)}</tr></thead>
                    <tbody>{dayData.map(d=>(
                      <tr key={d.day} style={{background:d.isToday?"rgba(0,113,227,.04)":"",fontWeight:d.isToday?600:400}}>
                        <td style={{color:d.isToday?"var(--blue)":"var(--t1)",fontWeight:d.isToday?700:500}}>{d.dayName}</td>
                        <td style={{color:"var(--t3)",fontSize:12}}>{d.dayShort}</td>
                        <td style={{textAlign:"center",color:d.count>0?"var(--blue)":"var(--t4)"}}>{d.count||"—"}</td>
                        <td style={{color:"var(--blue)",fontVariantNumeric:"tabular-nums"}}>{d.grossR>0?fmt(d.grossR)+" IQD":"—"}</td>
                        <td style={{color:d.disc>0?"var(--orange)":"var(--t4)",fontVariantNumeric:"tabular-nums"}}>{d.disc>0?"−"+fmt(d.disc)+" IQD":"—"}</td>
                        <td style={{color:d.ret>0?"var(--red)":"var(--t4)",fontVariantNumeric:"tabular-nums"}}>{d.ret>0?"−"+fmt(d.ret)+" IQD":"—"}</td>
                        <td style={{color:"var(--blue)",fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{d.netRev>0?fmt(d.netRev)+" IQD":"—"}</td>
                        <td style={{color:d.profit>0?"var(--green)":d.profit<0?"var(--red)":"var(--t4)",fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{d.profit!==0?fmt(d.profit)+" IQD":"—"}</td>
                        <td>{d.netRev>0?<Tag text={pct((d.profit/d.netRev)*100)+"%"} color={d.profit/d.netRev>.2?"var(--green)":d.profit/d.netRev>.1?"var(--orange)":"var(--red)"}/>:"—"}</td>
                      </tr>
                    ))}</tbody>
                    <tfoot><tr>
                      <td colSpan="2" style={{color:"var(--t3)",fontSize:12}}>المجموع</td>
                      <td style={{textAlign:"center",fontWeight:700}}>{wk.count}</td>
                      <td/>
                      <td style={{color:"var(--orange)",fontWeight:700}}>{wk.disc>0?"−"+fmt(wk.disc)+" IQD":"—"}</td>
                      <td/>
                      <td style={{color:"var(--blue)",fontWeight:700}}>{fmt(wk.rev)} IQD</td>
                      <td style={{color:"var(--green)",fontWeight:700}}>{fmt(wk.profit)} IQD</td>
                      <td><Tag text={pct(wk.rev>0?(wk.profit/wk.rev)*100:0)+"%"} color="var(--blue)"/></td>
                    </tr></tfoot>
                  </table></div>
                </Card>

                {wk.count>0&&(()=>{
                  const prodMap={};
                  dayData.forEach(d=>{sales.filter(s=>dayKey(s.date)===d.day).forEach(s=>{if(!prodMap[s.productName])prodMap[s.productName]={name:s.productName,qty:0,rev:0,profit:0};prodMap[s.productName].qty+=s.qty;prodMap[s.productName].rev+=s.total;prodMap[s.productName].profit+=s.profit;})});
                  const top=Object.values(prodMap).sort((a,b)=>b.rev-a.rev).slice(0,5);
                  return(
                    <Card title="أفضل المنتجات هذا الأسبوع" bar="var(--green)">
                      {top.map((p,i)=>(
                        <div key={p.name} className="dr">
                          <div style={{display:"flex",alignItems:"center",gap:9}}>
                            <span style={{fontFamily:"var(--sf-d)",fontSize:13,fontWeight:800,color:"var(--t4)",width:18,textAlign:"center"}}>{i+1}</span>
                            <div>
                              <div style={{fontSize:14,fontWeight:600}}>{p.name}</div>
                              <div style={{fontSize:11,color:"var(--t3)"}}>{p.qty} وحدة مباعة</div>
                            </div>
                          </div>
                          <div style={{textAlign:"left"}}>
                            <div style={{fontFamily:"var(--sf-d)",fontSize:14,fontWeight:700,color:"var(--blue)",fontVariantNumeric:"tabular-nums"}}>{fmt(p.rev)} IQD</div>
                            <div style={{fontSize:11,color:"var(--green)",fontVariantNumeric:"tabular-nums"}}>ربح: {fmt(p.profit)} IQD</div>
                          </div>
                        </div>
                      ))}
                    </Card>
                  );
                })()}
              </div>
            );
          })()}
        </div>
      )}

      {/* ══ REPORTS ══ */}
      {tab==="reports"&&(
        <div key="reports">
          <div className="g2" style={{marginBottom:13}}>
            <Card title={"P&L — "+plbl} bar="var(--blue)">
              <DR label="المبيعات الإجمالية (قبل الخصم)" val={fmt(M.grossRev)+" IQD"} color="var(--blue)"/>
              {M.disc>0&&<DR label="— الخصومات الممنوحة" val={"−"+fmt(M.disc)+" IQD"} color="var(--orange)" note={pct(M.grossRev>0?(M.disc/M.grossRev)*100:0)+"%"}/>}
              <DR label="— المرتجعات" val={fmt(-M.retVal)+" IQD"} color="var(--red)" note={pct(M.returnRate)+"%"}/>
              <DR label="= صافي المبيعات" val={fmt(M.netRev)+" IQD"} color="var(--blue)" bold/>
              <DR label="— تكلفة البضاعة" val={fmt(-M.cogs)+" IQD"}/>
              <DR label="= الربح الإجمالي" val={fmt(M.grossProfit)+" IQD"} bold/>
              <DR label="— التكاليف الثابتة" val={fmt(-M.totalFixed)+" IQD"}/>
              <DR label="— الإنفاق الإعلاني" val={fmt(-M.totalAds)+" IQD"} color="var(--purple)"/>
              <DR label="= صافي الربح" val={fmt(netProfitView)+" IQD"} color={netProfitView>=0?"var(--green)":"var(--red)"} bold/>
            </Card>
            <div>
              {MP&&(
                <Card title="مقارنة بالشهر السابق" bar="var(--indigo)">
                  {[{l:"صافي المبيعات",a:M.netRev,b:MP.netRev},{l:"الربح الإجمالي",a:M.grossProfit,b:MP.grossProfit},{l:"صافي الربح",a:netProfitView,b:prevNetProfitView},{l:"عدد المبيعات",a:M.salesCount,b:MP.salesCount,n:true}].map(r=>{
                    const d=dif(r.a,r.b);
                    return(
                      <div key={r.l} className="dr">
                        <span className="dr-l">{r.l}</span>
                        <div style={{display:"flex",alignItems:"center",gap:7}}>
                          <span className="dr-v">{r.n?r.a:fmt(r.a)}</span>
                          {d!==null&&<span className="delta" style={{color:difCol(d),background:difCol(d)+"12"}}>{difStr(d)}</span>}
                        </div>
                      </div>
                    );
                  })}
                </Card>
              )}
              <Card title="مؤشرات التسويق" bar="var(--purple)">
                <DR label="ROAS" val={pct(M.roas)+"x"} color={M.roas>=3?"var(--green)":M.roas>=1.5?"var(--orange)":"var(--red)"}/>
                <DR label="تكلفة الطلب (CPO)" val={fmt(M.cpo)+" IQD"} color="var(--blue)"/>
                <DR label="متوسط قيمة الطلب" val={fmt(M.aov)+" IQD"}/>
                <DR label="معدل التحويل" val={pct(M.convRate)+"%"} color="var(--orange)"/>
                <DR label="معدل المرتجعات" val={pct(M.returnRate)+"%"} color={M.returnRate<5?"var(--green)":M.returnRate<10?"var(--orange)":"var(--red)"}/>
              </Card>
            </div>
          </div>
          <Card title="صحة الهوامش" bar="var(--blue)">
            <div className="g4">
              <MBar label="هامش الربح الإجمالي" val={M.grossMargin} good={40} warn={25}/>
              <MBar label="هامش الربح الصافي" val={netMarginView} good={20} warn={10}/>
              <MBar label="نسبة إعلانات/مبيعات" val={M.netRev>0?(M.totalAds/M.netRev)*100:0} good={15} warn={25} inv/>
              <MBar label="معدل المرتجعات" val={M.returnRate} good={5} warn={10} inv/>
            </div>
          </Card>
          <Card title={"أداء المنتجات — "+plbl}>
            <div className="tbl-wrap"><table>
              <thead><tr>{["المنتج","سعر مورد","سعر بيع","هامش","هامش %","مباع","إيراد","COGS","ربح","تقييم"].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{products.map(p=>{
                const pS=sales.filter(s=>matchPeriod(s.date,period)&&s.productId===p.id);
                const pR=rets.filter(r=>matchPeriod(r.date,period)&&r.productId===p.id);
                const q=pS.reduce((a,s)=>a+(s.qty||1),0)-pR.reduce((a,r)=>a+(r.qty||1),0);
                const mg=p.sellPrice-p.buyPrice;const mp=p.sellPrice>0?(mg/p.sellPrice)*100:0;
                const c=mp>=35?"var(--green)":mp>=20?"var(--orange)":"var(--red)";
                return(
                  <tr key={p.id}>
                    <td style={{fontWeight:500}}>{p.name}</td>
                    <td style={{color:"var(--t2)"}}>{fmt(p.buyPrice)}</td>
                    <td style={{color:"var(--blue)"}}>{fmt(p.sellPrice)}</td>
                    <td style={{color:c,fontWeight:600}}>{fmt(mg)}</td>
                    <td><Tag text={pct(mp)+"%"} color={c}/></td>
                    <td style={{textAlign:"center",fontWeight:600}}>{q}</td>
                    <td style={{color:"var(--blue)"}}>{fmt(p.sellPrice*q)}</td>
                    <td style={{color:"var(--t2)"}}>{fmt(p.buyPrice*q)}</td>
                    <td style={{fontWeight:600}}>{fmt(mg*q)}</td>
                    <td><Tag text={mp>=35?"ممتاز":mp>=20?"جيد":"ضعيف"} color={c}/></td>
                  </tr>
                );
              })}</tbody>
            </table></div>
          </Card>
        </div>
      )}

      {/* ══ PRINT CENTER ══ */}
      {tab==="printcenter"&&(
        <div key="printcenter">
          <div className="g3" style={{marginBottom:13}}>
            <SBox label="آخر المبيعات" val={sales.length+" وصل"} color="var(--blue)" sub="إعادة طباعة فواتير البيع"/>
            <SBox label="آخر الطلبيات" val={orders.length+" طلبية"} color="var(--orange)" sub="إعادة طباعة الطلبيات"/>
            <SBox label="الجاهز للطباعة" val={(sales.length+orders.length)+" مستند"} color="var(--green)" sub="من جميع الأقسام"/>
          </div>
          <div className="g2">
            <Card title="آخر فواتير البيع" bar="var(--blue)" extra={<button className="btn bso bso-b" onClick={exportSalesXLS}>Excel</button>}>
              {sales.length===0?<div className="empty"><div className="empty-ico">🖨</div><div className="empty-txt">لا توجد فواتير بيع بعد</div></div>:<div className="tbl-wrap"><table>
                <thead><tr>{["الوصل","العميل","المنتج","الإجمالي","التاريخ",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
                <tbody>{sales.slice(0,20).map(s=><tr key={s.id}><td><span className="inv-num">{s.invoiceNum||"—"}</span></td><td>{s.customer||s.note||"—"}</td><td>{s.productName}</td><td style={{color:"var(--blue)",fontWeight:700}}>{fmt(s.total)} IQD</td><td style={{color:"var(--t3)"}}>{arDT(s.date)}</td><td><button className="btn-soft" onClick={()=>printSale(s)}>طباعة</button></td></tr>)}</tbody>
              </table></div>}
            </Card>
            <Card title="آخر الطلبيات" bar="var(--orange)" extra={<button className="btn bso bso-b" onClick={()=>setTab("orders")}>فتح الطلبيات</button>}>
              {orders.length===0?<div className="empty"><div className="empty-ico">📋</div><div className="empty-txt">لا توجد طلبيات بعد</div></div>:<div className="tbl-wrap"><table>
                <thead><tr>{["الطلبية","الزبون","الحالة","الإجمالي","التاريخ",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
                <tbody>{orders.slice(0,20).map(o=><tr key={o.id}><td style={{fontWeight:700}}>{o.orderId}</td><td>{o.customer}</td><td>{o.status}</td><td style={{color:"var(--blue)",fontWeight:700}}>{fmt(o.total||0)} IQD</td><td style={{color:"var(--t3)"}}>{arDT(o.date)}</td><td><button className="btn-soft" onClick={()=>printOrder(o)}>طباعة</button></td></tr>)}</tbody>
              </table></div>}
            </Card>
          </div>
        </div>
      )}

      {/* ══ TASKS ══ */}
      {tab==="tasks"&&(
        <div key="tasks">
          <div className="g4" style={{marginBottom:13}}>
            <SBox label="إجمالي المهام" val={tasks.length+" مهمة"} color="var(--blue)" sub="كل المهام المسجلة"/>
            <SBox label="قيد التنفيذ" val={tasks.filter(t=>t.status!=="done").length+" مهمة"} color="var(--orange)" sub="تحتاج متابعة"/>
            <SBox label="منجزة" val={tasks.filter(t=>t.status==="done").length+" مهمة"} color="var(--green)" sub="مغلقة"/>
            <SBox label="مستحقة اليوم" val={tasks.filter(t=>t.due===dayKey(new Date())&&t.status!=="done").length+" مهمة"} color="var(--red)" sub="بحسب تاريخ اليوم"/>
          </div>
          <Card title="إضافة مهمة" bar="var(--blue)">
            <div className="fg" style={{gridTemplateColumns:"2fr 1fr 1fr 1fr 2fr auto"}}>
              <div className="field"><label className="field-lbl">عنوان المهمة</label><input value={newTask.title} onChange={e=>setNewTask({...newTask,title:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">المسؤول</label><input value={newTask.owner} onChange={e=>setNewTask({...newTask,owner:e.target.value})} placeholder="اسم الموظف"/></div>
              <div className="field"><label className="field-lbl">الأولوية</label><select value={newTask.priority} onChange={e=>setNewTask({...newTask,priority:e.target.value})}><option>منخفضة</option><option>متوسطة</option><option>عالية</option></select></div>
              <div className="field"><label className="field-lbl">الاستحقاق</label><input type="date" value={newTask.due} onChange={e=>setNewTask({...newTask,due:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">ملاحظة</label><input value={newTask.note} onChange={e=>setNewTask({...newTask,note:e.target.value})}/></div>
              <button className="btn btn-blue" style={{height:44,marginTop:23,borderRadius:12}} onClick={addTask}>إضافة</button>
            </div>
          </Card>
          <Card title="قائمة المهام" bar="var(--indigo)">
            {tasks.length===0?<div className="empty"><div className="empty-ico">✓</div><div className="empty-txt">لا توجد مهام بعد</div></div>:<div className="tbl-wrap"><table>
              <thead><tr>{["المهمة","المسؤول","الأولوية","الاستحقاق","الحالة","الملاحظة",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{tasks.map(t=><tr key={t.id}>
                <td style={{fontWeight:700}}>{t.title}</td>
                <td>{t.owner||"—"}</td>
                <td><Tag text={t.priority} color={t.priority==="عالية"?"var(--red)":t.priority==="متوسطة"?"var(--orange)":"var(--green)"}/></td>
                <td style={{color:"var(--t3)"}}>{t.due||"—"}</td>
                <td><Tag text={t.status==="done"?"منجزة":"مفتوحة"} color={t.status==="done"?"var(--green)":"var(--blue)"}/></td>
                <td style={{color:"var(--t3)"}}>{t.note||"—"}</td>
                <td><div className="row-actions"><button className="btn-soft" onClick={()=>toggleTaskStatus(t.id)}>{t.status==="done"?"إعادة فتح":"إنجاز"}</button><button className="btn-icon" onClick={()=>delTask(t.id)}>✕</button></div></td>
              </tr>)}</tbody>
            </table></div>}
          </Card>
        </div>
      )}

      {/* ══ ARCHIVE ══ */}
      {tab==="archive"&&(
        <div key="archive">
          <div className="g4" style={{marginBottom:13}}>
            <SBox label="العناصر المؤرشفة" val={archiveItems.length+" عنصر"} color="var(--blue)" sub="قابلة للاسترجاع"/>
            <SBox label="منتجات قابلة للأرشفة" val={products.length+" منتج"} color="var(--green)" sub="من قسم المنتجات"/>
            <SBox label="طلبيات قابلة للأرشفة" val={orders.length+" طلبية"} color="var(--orange)" sub="من قسم الطلبيات"/>
            <SBox label="حملات قابلة للأرشفة" val={campaigns.length+" حملة"} color="var(--indigo)" sub="من قسم الحملات"/>
          </div>
          <div className="g2">
            <Card title="ترشيحات سريعة للأرشفة" bar="var(--orange)">
              <div className="dr"><span className="dr-l">آخر المنتجات</span><div className="row-actions">{products.slice(0,3).map(p=><button key={p.id} className="btn-soft" onClick={()=>archiveProduct(p.id)}>{p.name}</button>)}</div></div>
              <div className="dr"><span className="dr-l">آخر الطلبيات</span><div className="row-actions">{orders.slice(0,3).map(o=><button key={o.id} className="btn-soft" onClick={()=>archiveOrder(o.id)}>{o.orderId}</button>)}</div></div>
              <div className="dr"><span className="dr-l">الحملات</span><div className="row-actions">{campaigns.slice(0,3).map(c=><button key={c.id} className="btn-soft" onClick={()=>archiveCampaign(c.id)}>{c.name}</button>)}</div></div>
              <div className="dr"><span className="dr-l">المستخدمون</span><div className="row-actions">{users.filter(u=>u.username!=="admin").slice(0,3).map(u=><button key={u.username} className="btn-soft" onClick={()=>archiveUser(u.username)}>{u.d}</button>)}</div></div>
            </Card>
            <Card title="سياسة الأرشيف" bar="var(--teal)">
              <div style={{fontSize:13,color:"var(--t2)",lineHeight:1.9}}>الأرشيف هنا لا يحذف البيانات نهائيًا، بل ينقلها من القسم الأصلي إلى مخزن قابل للاسترجاع. يمكنك أرشفة المنتجات أو الطلبيات أو الحملات أو الموردين أو المستخدمين ثم إعادتها لاحقًا عند الحاجة.</div>
            </Card>
          </div>
          <Card title="العناصر المؤرشفة" bar="var(--indigo)">
            {archiveItems.length===0?<div className="empty"><div className="empty-ico">🗂</div><div className="empty-txt">لا توجد عناصر مؤرشفة بعد</div></div>:<div className="tbl-wrap"><table>
              <thead><tr>{["النوع","العنوان","تاريخ الأرشفة",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{archiveItems.map(a=><tr key={a.id}>
                <td><Tag text={a.type} color="var(--blue)"/></td>
                <td style={{fontWeight:700}}>{a.title}</td>
                <td style={{color:"var(--t3)"}}>{arDT(a.date)}</td>
                <td><div className="row-actions"><button className="btn-soft" onClick={()=>restoreArchive(a.id)}>استرجاع</button><button className="btn-icon" onClick={()=>delArchiveItem(a.id)}>✕</button></div></td>
              </tr>)}</tbody>
            </table></div>}
          </Card>
        </div>
      )}

      {/* ══ TOOLS ══ */}
      {tab==="tools"&&(
        <div key="tools" className="g2">
          <Card title="حاسبة سعر البيع" bar="var(--blue)">
            <div className="field" style={{marginBottom:13}}><label className="field-lbl">سعر المورد (IQD)</label><input type="number" placeholder="8000" value={calc.buy} onChange={e=>setCalc({...calc,buy:e.target.value})}/></div>
            <div className="field" style={{marginBottom:18}}><label className="field-lbl">هامش الربح المطلوب %</label><input type="number" placeholder="40" value={calc.margin} onChange={e=>setCalc({...calc,margin:e.target.value})}/></div>
            {calc.buy&&calc.margin&&(()=>{
              const buy=Number(calc.buy);const mg=Math.min(Number(calc.margin),99.9);
              const sell=buy/(1-mg/100);const profit=sell-buy;
              return(
                <div className="g2">
                  {[{l:"سعر البيع المقترح",v:fmt(sell)+" IQD",c:"var(--blue)"},{l:"ربح الوحدة",v:fmt(profit)+" IQD",c:"var(--green)"},{l:"تحقق الهامش",v:pct(sell>0?(profit/sell)*100:0)+"%",c:"var(--indigo)"},{l:"مضاعف السعر",v:pct(sell/buy)+"x",c:"var(--purple)"}].map(x=>(
                    <SBox key={x.l} label={x.l} val={x.v} color={x.c}/>
                  ))}
                </div>
              );
            })()}
          </Card>
          <Card title="نقطة التعادل (Break-Even)" bar="var(--indigo)">
            {(()=>{
              const fc=fixed.reduce((a,f)=>a+Number(f.monthly||0),0);
              const avgMargin=products.length>0?products.reduce((a,p)=>a+(p.sellPrice>0?((p.sellPrice-p.buyPrice)/p.sellPrice)*100:0),0)/products.length:0;
              const avgSell=products.length>0?products.reduce((a,p)=>a+p.sellPrice,0)/products.length:0;
              const beUnits=avgMargin>0&&avgSell>0?Math.ceil(fc/(avgSell*(avgMargin/100))):0;
              const beRev=avgSell*beUnits;
              const sm=beUnits>0?((M.salesCount-beUnits)/beUnits)*100:0;
              return(
                <div>
                  <div className="g2" style={{marginBottom:13}}>
                    {[{l:"التكاليف الثابتة الشهرية",v:fmt(fc)+" IQD",c:"var(--red)"},{l:"متوسط هامش الربح",v:pct(avgMargin)+"%",c:"var(--blue)"},{l:"وحدات للتعادل",v:beUnits+" وحدة",c:"var(--orange)"},{l:"إيراد التعادل",v:fmt(beRev)+" IQD",c:"var(--indigo)"}].map(x=>(
                      <SBox key={x.l} label={x.l} val={x.v} color={x.c}/>
                    ))}
                  </div>
                  <div style={{padding:"13px 15px",borderRadius:"var(--r-md)",background:sm>20?"var(--green-a)":sm>0?"var(--orange-a)":"var(--red-a)",border:".5px solid "+(sm>20?"rgba(52,199,89,.25)":sm>0?"rgba(255,149,0,.25)":"rgba(255,59,48,.25)")}}>
                    <div style={{fontSize:12,fontWeight:600,color:"var(--t2)",marginBottom:5}}>الوضع الحالي — {plbl}</div>
                    <div style={{fontSize:14,color:"var(--t1)"}}>
                      بعت <strong style={{color:"var(--blue)"}}>{M.salesCount} وحدة</strong> من أصل <strong>{beUnits}</strong> للتعادل{" — "}
                      {sm>0?<span style={{color:"var(--green)",fontWeight:700}}>✓ تجاوزت التعادل بـ {pct(sm)}%</span>:<span style={{color:"var(--red)",fontWeight:700}}>⚠ تحت التعادل بـ {pct(Math.abs(sm))}%</span>}
                    </div>
                  </div>
                </div>
              );
            })()}
          </Card>
          <Card title="مستشار ميزانية الإعلانات" bar="var(--purple)">
            <div style={{fontSize:13,color:"var(--t3)",marginBottom:15}}>الربح الإجمالي: <strong style={{color:"var(--t1)",fontVariantNumeric:"tabular-nums"}}>{fmt(M.grossProfit)} IQD</strong></div>
            {[{l:"محافظ 20%",v:M.grossProfit*.2,c:"var(--green)",t:"أمان"},{l:"مثالي 30%",v:M.grossProfit*.3,c:"var(--blue)",t:"موصى به"},{l:"عدواني 40%",v:M.grossProfit*.4,c:"var(--red)",t:"مخاطرة"}].map(b=>(
              <div key={b.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 0",borderBottom:".5px solid var(--line)"}}>
                <div><div style={{fontSize:14,marginBottom:4}}>{b.l}</div><Tag text={b.t} color={b.c}/></div>
                <span style={{fontFamily:"var(--sf-d)",fontSize:19,fontWeight:700,color:b.c,letterSpacing:"-.04em",fontVariantNumeric:"tabular-nums"}}>{fmt(b.v)} IQD</span>
              </div>
            ))}
            <div style={{marginTop:13,padding:"11px 15px",background:"var(--bg)",border:".5px solid var(--line2)",borderRadius:9,fontSize:12,color:"var(--t3)"}}>
              إنفاقك الحالي: <strong style={{color:"var(--purple)",fontVariantNumeric:"tabular-nums"}}>{fmt(M.totalAds)} IQD</strong>{" — "}
              {M.totalAds<=M.grossProfit*.3?<span style={{color:"var(--green)",fontWeight:600}}>✓ ضمن الحد الآمن</span>:<span style={{color:"var(--red)",fontWeight:600}}>⚠ تجاوز الحد</span>}
            </div>
          </Card>
          <Card title="ملخص المورد — كل الوقت" bar="var(--teal)">
            <DR label="إجمالي ما بعته" val={fmt(sales.reduce((a,s)=>a+s.total,0))+" IQD"} color="var(--blue)"/>
            <DR label="تكلفة البضاعة الكلية" val={fmt(sales.reduce((a,s)=>a+s.buyPrice*(s.qty||1),0))+" IQD"}/>
            <DR label="إجمالي الدفعات للمورد" val={fmt(pays.reduce((a,p)=>a+Number(p.amount||0),0))+" IQD"} color="var(--green)"/>
            <DR label="المتبقي" val={fmt(sales.reduce((a,s)=>a+s.buyPrice*(s.qty||1),0)-pays.reduce((a,p)=>a+Number(p.amount||0),0))+" IQD"} color="var(--red)" bold/>
          </Card>
        </div>
      )}

      {tab==="notifications"&&(
        <div key="notifications">
          <div className="g4" style={{marginBottom:13}}>
            <SBox label="إجمالي التنبيهات" val={alertItems.length+" تنبيه"} color={alertItems.length>0?"var(--orange)":"var(--green)"} sub="مركز تنبيهات كامل"/>
            <SBox label="مخزون منخفض" val={stAlr.length+" منتج"} color={stAlr.length>0?"var(--orange)":"var(--green)"} sub="بحسب حد التنبيه"/>
            <SBox label="طلبات معلقة" val={pendingOrders.length+" طلبية"} color={pendingOrders.length>0?"var(--blue)":"var(--green)"} sub="تحتاج متابعة"/>
            <SBox label="ديون غير مسددة" val={pendingCredits.length+" حالة"} color={pendingCredits.length>0?"var(--red)":"var(--green)"} sub="للزبائن"/>
          </div>
          <Card title="مركز التنبيهات" bar="var(--orange)">
            {alertItems.length===0?<div className="empty"><div className="empty-ico">🔔</div><div className="empty-txt">لا توجد تنبيهات حالياً</div></div>:alertItems.map(a=><AlertBar key={a.id} msg={a.section+" — "+a.msg} color={a.type==="error"?"var(--red)":a.type==="info"?"var(--blue)":"var(--orange)"}/>)}
          </Card>
        </div>
      )}

      {tab==="settings"&&isAdmin&&(
        <div key="settings" className="g2">
          <Card title="إعدادات المتجر" bar="var(--blue)">
            <div className="fg" style={{gridTemplateColumns:"1fr 1fr",marginBottom:12}}>
              <div className="field"><label className="field-lbl">اسم المتجر</label><input value={settings.storeName||""} onChange={e=>setSettings({...settings,storeName:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">مسار الشعار</label><input value={settings.logo||""} onChange={e=>setSettings({...settings,logo:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">الهاتف</label><input value={settings.phone||""} onChange={e=>setSettings({...settings,phone:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">العنوان</label><input value={settings.address||""} onChange={e=>setSettings({...settings,address:e.target.value})}/></div>
            </div>
            <div style={{padding:"12px 14px",background:"var(--bg)",border:"1px solid var(--line2)",borderRadius:14,fontSize:13,color:"var(--t2)"}}>الضريبة معطلة حالياً وقيمتها 0% حسب إعداداتك.</div>
          </Card>
          <Card title="هوية المتجر" bar="var(--teal)">
            <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
              <div style={{width:110,height:110,borderRadius:24,background:"#ffd400",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",border:"1px solid rgba(0,0,0,.06)"}}>
                <img src={settings.logo||"t2.png"} alt="BA Center" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}}/>
              </div>
              <div>
                <div style={{fontFamily:"var(--sf-d)",fontSize:24,fontWeight:800,letterSpacing:"-.04em"}}>{(settings.storeName||"ba center").toUpperCase()}</div>
                <div style={{fontSize:13,color:"var(--t3)",marginTop:6}}>{settings.phone||"أضف رقم الهاتف من الإعدادات"}</div>
                <div style={{fontSize:13,color:"var(--t3)",marginTop:4}}>{settings.address||"أضف عنوان المتجر من الإعدادات"}</div>
              </div>
            </div>
          </Card>
          <Card title="منطقة الخطر" bar="var(--red)">
            <div style={{padding:"12px 14px",background:"var(--red-a)",border:"1px solid rgba(239,68,68,.25)",borderRadius:14,fontSize:13,color:"#991b1b",lineHeight:1.9,marginBottom:12}}>
              حذف كل البيانات سيقوم بمسح العمليات والسجلات وإعادة النظام للوضع الابتدائي. هذا الإجراء نهائي.
            </div>
            <button className="btn btn-red" style={{borderRadius:12}} onClick={wipeAllData}>حذف كل البيانات</button>
          </Card>
        </div>
      )}

      {tab==="logs"&&(
        <div key="logs">
          <div className="g4" style={{marginBottom:13}}>
            <SBox label="إجمالي السجلات" val={logs.length+" حركة"} color="var(--blue)" sub="آخر 500 حركة محفوظة"/>
            <SBox label="حركات اليوم" val={logs.filter(l=>dayKey(l.date)===dayKey(new Date())).length+" حركة"} color="var(--green)" sub="بحسب تاريخ اليوم"/>
            <SBox label="آخر مستخدم" val={(logs[0]?.user)||"—"} color="var(--orange)" sub={(logs[0]?.section)||"لا يوجد"}/>
            <SBox label="آخر تحديث" val={logs[0]?arT(logs[0].date):"—"} color="var(--indigo)" sub={logs[0]?arD(logs[0].date):"لا يوجد"}/>
          </div>
          <Card title="سجل الحركات" bar="var(--indigo)">
            {logs.length===0?<div className="empty"><div className="empty-ico">🕘</div><div className="empty-txt">لا توجد سجلات بعد</div></div>:<div className="tbl-wrap"><table>
              <thead><tr>{["التاريخ","الوقت","المستخدم","الدور","القسم","الحركة","التفاصيل",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{logs.map(l=>(
                <tr key={l.id}>
                  <td style={{color:"var(--t3)",fontSize:12}}>{arD(l.date)}</td>
                  <td style={{color:"var(--t3)",fontSize:12}}>{arT(l.date)}</td>
                  <td style={{fontWeight:600}}>{l.user}</td>
                  <td>{ROLE_LABELS[l.role]||l.role}</td>
                  <td style={{color:"var(--blue)"}}>{l.section}</td>
                  <td>{l.action}</td>
                  <td style={{color:"var(--t3)"}}>{l.details||"—"}</td>
                  <td>{isAdmin&&<button className="btn-icon" onClick={()=>delLog(l.id)}>✕</button>}</td>
                </tr>
              ))}</tbody>
            </table></div>}
          </Card>
        </div>
      )}

      {tab==="users"&&isAdmin&&(
        <div key="users" className="g2">
          <Card title="إضافة مستخدم" bar="var(--blue)">
            <div className="fg" style={{gridTemplateColumns:"1fr 1fr",marginBottom:12}}>
              <div className="field"><label className="field-lbl">اسم المستخدم</label><input placeholder="ahmed" value={newUser.username} onChange={e=>setNewUser({...newUser,username:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">الاسم الظاهر</label><input placeholder="أحمد" value={newUser.displayName} onChange={e=>setNewUser({...newUser,displayName:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">كلمة المرور</label><input type="password" placeholder="••••••" value={newUser.password} onChange={e=>setNewUser({...newUser,password:e.target.value})}/></div>
              <div className="field"><label className="field-lbl">الدور</label><select value={newUser.role} onChange={e=>setNewUser({...newUser,role:e.target.value})}>{Object.keys(ROLE_LABELS).filter(r=>r!=="admin"||isAdmin).map(r=><option key={r} value={r}>{ROLE_LABELS[r]}</option>)}</select></div>
            </div>
            <button className="btn btn-blue" style={{borderRadius:12}} onClick={addUser}>إضافة المستخدم</button>
          </Card>
          <Card title="المستخدمون الحاليون" bar="var(--green)">
            <div className="tbl-wrap"><table>
              <thead><tr>{["اسم المستخدم","الاسم","الدور","الحالة",""].map(h=><th key={h}>{h}</th>)}</tr></thead>
              <tbody>{users.map(u=>(
                <tr key={u.username}>
                  <td style={{fontWeight:700}}>{u.username}</td>
                  <td>{u.d}</td>
                  <td>{ROLE_LABELS[u.role]||u.role}</td>
                  <td><Tag text={u.active===false?"معطل":"فعال"} color={u.active===false?"var(--red)":"var(--green)"}/></td>
                  <td>{u.username!=="admin"&&<div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:8}}><AppleSwitch on={u.active!==false} onClick={()=>toggleUserActive(u.username)} labelOn="تشغيل" labelOff="إيقاف"/><button className="btn-icon" onClick={()=>delUser(u.username)}>✕</button></div>}</td>
                </tr>
              ))}</tbody>
            </table></div>
          </Card>
        </div>
      )}

      </div>

      {/* ══ BOTTOM NAVIGATION (Mobile) ══ */}
      {isMobile&&<div className="nav-hint no-print">اسحب الشريط السفلي يمينًا ويسارًا لإظهار كل الأقسام</div>}
      <div className="bottom-nav" style={{display:isMobile?"flex":"none"}}>
        {mobileNav.map(item=>(
          <button 
            key={item.id}
            className={`bottom-nav-item${tab===item.id?" active":""}`}
            onClick={()=>setTab(item.id)}
            style={{touchAction:"manipulation"}}
          >
            <div className="bottom-nav-item-icon">{item.ic}</div>
            <div className="bottom-nav-item-label">{item.lb}</div>
          </button>
        ))}
      </div>

    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
